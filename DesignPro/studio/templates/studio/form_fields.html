{{ form.non_field_errors }}
{% for field in form.visible_fields %}
  <div class="field{% if field.errors %} invalid{% endif %}{% if field.name == 'consent' %} checkbox{% endif %}">
    {% if field.name == "consent" %}
      <label for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
    {% else %}
      {{ field.label_tag }}
      {{ field }}
    {% endif %}
    {% if field.help_text %}
      <div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
    {% endif %}
    {{ field.errors }}
  </div>
{% endfor %}
