{% extends "base.html" %}
{% block content %}
<h1>Новый пароль</h1>
{% if validlink %}
  <form method="post" class="edit-form">{% csrf_token %}{{ form.as_p }}<button class="button">Сохранить пароль</button></form>
{% else %}
  <p>Ссылка недействительна или уже использована.</p><a href="{% url 'password_reset' %}">Запросить новую ссылку</a>
{% endif %}
{% endblock %}
